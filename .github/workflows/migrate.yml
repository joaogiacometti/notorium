name: Migrate Production Database

on:
  push:
    branches: [main]
    paths:
      - "src/db/schema.ts"
      - "drizzle/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations if database is configured
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm run db:migrate
          else
            echo "DATABASE_URL secret not configured; skipping migrations."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}