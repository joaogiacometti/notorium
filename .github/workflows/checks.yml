name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type Check & Test
    if: github.repository == 'joaogiacometti/notorium'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm run test

      - name: File-size guard
        run: npm run check:size

      - name: Dead-code guard (Knip)
        run: npm run check:deadcode
