name: Assistant Evals

# Each run pays for real model replies, so it follows changes to what the model
# sees rather than every push. It reports results and blocks nothing.
on:
  push:
    branches: [main]
    paths:
      - "src/features/assistant/**"
      - "src/features/flashcards/ai-prompts.ts"
      - "src/lib/ai/**"
      - "evals/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Real-model evals
    if: github.repository != 'joaogiacometti/notorium'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      # Required at startup, but evals use no database, email, storage, or auth.
      DATABASE_URL: postgres://stub
      BETTER_AUTH_SECRET: evals-placeholder-secret-not-used-here
      BLOB_READ_WRITE_TOKEN: evals-placeholder
      RESEND_API_KEY: evals-placeholder
      RESEND_FROM_EMAIL: evals@example.com
      CRON_SECRET: evals-placeholder-secret-not-used-here
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run evals
        run: npm run eval

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-transcripts
          path: evals/transcripts/
          if-no-files-found: ignore
